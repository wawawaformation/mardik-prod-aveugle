name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      jaeger:
        image: jaegertracing/all-in-one:1.57
        env:
          COLLECTOR_OTLP_ENABLED: "true"
        ports:
          - 4317:4317
          - 16686:16686
        options: >-
          --health-cmd "wget -qO- http://localhost:14269/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/unit tests/integration
